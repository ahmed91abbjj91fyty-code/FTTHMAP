<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتتبع شبكة الإنترنت - السحابي المباشر</title>
    <!-- استدعاء مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- استدعاء مكتبة Supabase للاتصال السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 12px 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        #main-container {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 54px);
        }
        #sidebar {
            width: 300px;
            background-color: #f8fafc;
            border-left: 1px solid #cbd5e1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
        .stats-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="header">لوحة التحكم - التزامن اللحظي المباشر</div>
    
    <div id="main-container">
        <!-- الشريط الجانبي للإحصائيات وأدوات التتبع -->
        <div id="sidebar">
            <h3>لوحة الإدارة</h3>
            <p style="font-size: 13px; color: #475569; line-height: 1.4;">
                النقاط تظهر وتتزامن الآن لحظياً بين جميع الأجهزة بدون الحاجة لإعادة تحميل الصفحة.
            </p>
            <div class="stats-box">
                <p><b>عدد الكابينات:</b> <span id="cab-count">0</span></p>
                <p><b>عدد المشتركين:</b> <span id="sub-count">0</span></p>
            </div>

            <hr style="border: 0; border-top: 1px solid #cbd5e1;">

            <h4>نظام تتبع العمال</h4>
            <button class="btn-primary" onclick="startLiveTracking()">بدء تتبعي الميداني (GPS)</button>
            <div id="tracking-status" style="font-size: 12px; color: #047857; font-weight: bold; margin-top: 5px;"></div>
        </div>

        <!-- الخريطة -->
        <div id="map"></div>
    </div>

    <script>
        // 1. إعدادات الاتصال بقاعدة بيانات Supabase السحابية
        const SUPABASE_URL = 'https://zoqbqaefkyznsxhcaakk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvcWJxYWVma3l6bnN4aGNhYWtrIksicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzYzMDcsImV4cCI6MjEwODAxMjMwN30.drwpDj0CTp766eK3zs4PdYhGGzBmJ_wmVCdPdcJNvW8';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. تهيئة الخريطة بمركز بغداد
        var map = L.map('map').setView([33.3250, 44.4300], 13);

        L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let cabCount = 0;
        let subCount = 0;

        function updateCounters() {
            document.getElementById('cab-count').innerText = cabCount;
            document.getElementById('sub-count').innerText = subCount;
        }

        // دالة رسم النقطة على الخريطة
        function renderPoint(point) {
            if (point.type === 'cabinet') {
                var marker = L.marker([point.lat, point.lng]).addTo(map);
                marker.bindPopup(`<b>كابينة: ${point.name}</b><br>الإحداثيات: ${point.lat.toFixed(4)}, ${point.lng.toFixed(4)}`);
                cabCount++;
            } else {
                var marker = L.circleMarker([point.lat, point.lng], {
                    color: 'green',
                    fillColor: '#22c55e',
                    fillOpacity: 0.8,
                    radius: 8
                }).addTo(map);
                marker.bindPopup(`<b>مشترك: ${point.name}</b><br>الإحداثيات: ${point.lat.toFixed(4)}, ${point.lng.toFixed(4)}`);
                subCount++;
            }
            updateCounters();
        }

        // 3. جلب البيانات الأولية عند تحميل الصفحة
        async function fetchPointsFromCloud() {
            let { data, error } = await _supabase.from('points').select('*');
            if (!error && data) {
                cabCount = 0;
                subCount = 0;
                data.forEach(point => renderPoint(point));
            }
        }

        fetchPointsFromCloud();

        // 4. تفعيل الاستماع الفوري (Realtime) لتحديث النقاط على الشاشة تلقائياً
        _supabase
            .channel('public:points')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'points' }, payload => {
                renderPoint(payload.new);
            })
            .subscribe();

        // 5. حدث النقر على الخريطة لإضافة موقع جديد وحفظه سحابياً
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var formHtml = `
                <div style="font-family: Arial; direction: rtl; text-align: right; min-width: 200px;">
                    <h4 style="margin: 0 0 10px 0; color: #1e293b;">إضافة موقع جديد (لحظي)</h4>
                    <form onsubmit="addNewPointToCloud(event, ${lat}, ${lng})">
                        <label style="font-size: 13px; font-weight: bold;">نوع الموقع:</label><br>
                        <select id="input-type" style="width: 100%; padding: 6px; margin-top: 4px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="cabinet">كابينة انترنت</option>
                            <option value="subscriber">مشترك جديد</option>
                        </select><br>
                        
                        <label style="font-size: 13px; font-weight: bold;">الاسم / الرمز:</label><br>
                        <input type="text" id="input-name" required placeholder="مثال: C-102 أو محمد كريم" style="width: 100%; padding: 6px; margin-top: 4px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;"><br>
                        
                        <button type="submit" style="background: #2563eb; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold;">حفظ ونشر مباشر</button>
                    </form>
                </div>
            `;

            L.popup()
                .setLatLng(e.latlng)
                .setContent(formHtml)
                .openOn(map);
        });

        // 6. دالة إرسال البيانات مباشرة إلى جدول Supabase
        window.addNewPointToCloud = async function(event, lat, lng) {
            event.preventDefault();
            
            var type = document.getElementById('input-type').value;
            var name = document.getElementById('input-name').value;

            let newPoint = { type, name, lat, lng };

            const { error } = await _supabase.from('points').insert([newPoint]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ بالسحابة: ' + error.message);
            } else {
                map.closePopup();
            }
        };

        // 7. نظام تتبع عمال الصيانة الحي
        let techMarker = null;
        let watchId = null;

        window.startLiveTracking = function() {
            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم خاصية التتبع الجغرافي GPS");
                return;
            }

            document.getElementById('tracking-status').innerText = "جاري الاتصال بالأقمار الصناعية وتحديد الموقع...";

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    document.getElementById('tracking-status').innerText = "🟢 التتبع نشط: يتم تحديث الموقع بنجاح";

                    if (!techMarker) {
                        techMarker = L.circleMarker([lat, lng], {
                            color: '#dc2626',
                            fillColor: '#ef4444',
                            fillOpacity: 1,
                            radius: 12,
                            weight: 3
                        }).addTo(map);
                        techMarker.bindPopup("<b>عامل الصيانة (أنت)</b><br>الموقع الميداني الحالي").openPopup();
                        map.setView([lat, lng], 15);
                    } else {
                        techMarker.setLatLng([lat, lng]);
                    }
                },
                function(error) {
                    document.getElementById('tracking-status').innerText = "❌ تعذر الحصول على الموقع. تأكد من السماح للمتصفح بالوصول للـ GPS.";
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 10000
                }
            );
        };
    </script>
</body>
</html>
