<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتتبع شبكة الإنترنت - تتبع مسار حركة العمال</title>
    <!-- استدعاء مكتبة Leaflet للخرائط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- استدعاء مكتبة Supabase للاتصال السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 12px 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        #main-container {
            display: flex;
            flex-grow: 1;
            height: calc(100vh - 54px);
        }
        #sidebar {
            width: 300px;
            background-color: #f8fafc;
            border-left: 1px solid #cbd5e1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
        .stats-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            font-weight: bold;
        }
        .btn-filter {
            background: #475569;
            color: white;
            border: none;
            padding: 6px 8px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            flex: 1;
        }
        .btn-filter.active {
            background: #0284c7;
        }
        .filter-container {
            display: flex;
            gap: 5px;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-success {
            background: #16a34a;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .worker-marker-icon {
            background-color: #ef4444;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="header">لوحة التحكم - إدارة وتتبع مسارات حركة العمال</div>
    
    <div id="main-container">
        <!-- الشريط الجانبي للإحصائيات وأدوات التصفية -->
        <div id="sidebar">
            <h3>لوحة الإدارة</h3>
            <p style="font-size: 13px; color: #475569; line-height: 1.4;">
                انقر على الخريطة للإضافة، أو استخدم أزرار التصفية أدناه للتحكم بما يظهر على الخريطة.
            </p>
            
            <div class="stats-box">
                <p><b>عدد الكابينات:</b> <span id="cab-count">0</span></p>
                <p><b>عدد المشتركين:</b> <span id="sub-count">0</span></p>
            </div>

            <hr style="border: 0; border-top: 1px solid #cbd5e1;">

            <!-- قسم تصفية العرض -->
            <h4>تصفية العرض</h4>
            <div class="filter-container">
                <button id="filter-all" class="btn-filter active" onclick="setFilter('all')">الكل</button>
                <button id="filter-cabinet" class="btn-filter" onclick="setFilter('cabinet')">الكابينات</button>
                <button id="filter-subscriber" class="btn-filter" onclick="setFilter('subscriber')">المشتركين</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #cbd5e1;">

            <h4>نظام تتبع العمال ورسم المسار</h4>
            <button class="btn-primary" onclick="startLiveTracking()">بدء تتبعي وتسجيل مساري (GPS)</button>
            <button class="btn-danger" style="margin-top: 5px; width: 100%;" onclick="clearWorkerRoute()">مسح سجل المسار من الخريطة</button>
            <div id="tracking-status" style="font-size: 12px; color: #047857; font-weight: bold; margin-top: 5px;"></div>
        </div>

        <!-- الخريطة -->
        <div id="map"></div>
    </div>

    <script>
        // 1. إعدادات الاتصال بقاعدة بيانات Supabase السحابية
        const SUPABASE_URL = 'https://zoqbqaefkyznsxhcaakk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvcWJxYWVma3l6bnN4aGNhYWtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzYzMDcsImV4cCI6MjEwODAxMjMwN30.drwpDj0CTp766eK3zs4PdYhGGzBmJ_wmVCdPdcJNvW8';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. تهيئة الخريطة بمركز بغداد
        var map = L.map('map').setView([33.3250, 44.4300], 13);

        L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let allPoints = []; 
        let markersMap = {}; 
        let currentFilter = 'all'; 
        let realtimeChannel = null;

        // متغيرات تتبع المسار
        let routeCoordinates = [];
        let routePolyline = L.polyline([], { color: '#0284c7', weight: 4, opacity: 0.8 }).addTo(map);

        function updateCounters() {
            let cabs = allPoints.filter(p => p.type === 'cabinet').length;
            let subs = allPoints.filter(p => p.type === 'subscriber').length;
            document.getElementById('cab-count').innerText = cabs;
            document.getElementById('sub-count').innerText = subs;
        }

        window.setFilter = function(filterType) {
            currentFilter = filterType;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filterType}`).classList.add('active');
            refreshMapMarkers();
        };

        function refreshMapMarkers() {
            for (let id in markersMap) {
                map.removeLayer(markersMap[id]);
            }
            markersMap = {};

            allPoints.forEach(point => {
                if (currentFilter === 'all' || currentFilter === point.type) {
                    createMarkerOnMap(point);
                }
            });
            updateCounters();
        }

        function createMarkerOnMap(point) {
            var marker;
            var popupContent = `
                <div style="font-family: Arial; direction: rtl; text-align: right; min-width: 180px;">
                    <h4 style="margin: 0 0 5px 0; color: #1e293b;">${point.type === 'cabinet' ? 'كابينة إنترنت' : 'مشترك جديد'}</h4>
                    <p style="margin: 0 0 8px 0; font-size: 14px;"><b>الاسم:</b> ${point.name}</p>
                    <p style="margin: 0 0 10px 0; font-size: 11px; color: #64748b;">الإحداثيات: ${point.lat.toFixed(4)}, ${point.lng.toFixed(4)}</p>
                    
                    <div style="margin-bottom: 8px;">
                        <input type="text" id="edit-name-${point.id}" value="${point.name}" placeholder="الاسم الجديد" style="width: 90%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; margin-bottom: 5px;">
                        <button class="btn-success" onclick="updatePointName(${point.id})" style="width: 100%;">تعديل الاسم</button>
                    </div>
                    <button class="btn-danger" onclick="deletePoint(${point.id})" style="width: 100%;">حذف الموقع</button>
                </div>
            `;

            if (point.type === 'cabinet') {
                marker = L.marker([point.lat, point.lng]).addTo(map);
            } else {
                marker = L.circleMarker([point.lat, point.lng], {
                    color: 'green',
                    fillColor: '#22c55e',
                    fillOpacity: 0.8,
                    radius: 8
                }).addTo(map);
            }

            marker.bindPopup(popupContent);
            markersMap[point.id] = marker;
        }

        // 3. جلب نقاط الكابينات والمشتركين
        async function fetchPointsFromCloud() {
            let { data, error } = await _supabase.from('points').select('*');
            if (!error && data) {
                allPoints = data;
                refreshMapMarkers();
            }
        }

        // 4. جلب مسار حركة العمال من السحابة ورسم الخط الأزرق
        async function fetchWorkerRouteFromCloud() {
            let { data, error } = await _supabase.from('worker_locations').select('*').order('created_at', { ascending: true });
            if (!error && data) {
                routeCoordinates = data.map(item => [item.lat, item.lng]);
                routePolyline.setLatLngs(routeCoordinates);
            }
        }

        // 5. تفعيل وربط الـ Realtime لنقاط الخريطة والمسار اللحظي
        function initRealtimeSubscription() {
            if (realtimeChannel) {
                _supabase.removeChannel(realtimeChannel);
            }

            realtimeChannel = _supabase
                .channel('public:all_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'points' }, () => {
                    fetchPointsFromCloud();
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'worker_locations' }, payload => {
                    let newLoc = [payload.new.lat, payload.new.lng];
                    routeCoordinates.push(newLoc);
                    routePolyline.setLatLngs(routeCoordinates);
                })
                .subscribe();
        }

        fetchPointsFromCloud();
        fetchWorkerRouteFromCloud();
        initRealtimeSubscription();

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                fetchPointsFromCloud();
                fetchWorkerRouteFromCloud();
                initRealtimeSubscription();
            }
        });

        // 6. حدث النقر على الخريطة للإضافة
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var formHtml = `
                <div style="font-family: Arial; direction: rtl; text-align: right; min-width: 200px;">
                    <h4 style="margin: 0 0 10px 0; color: #1e293b;">إضافة موقع جديد</h4>
                    <form onsubmit="addNewPointToCloud(event, ${lat}, ${lng})">
                        <label style="font-size: 13px; font-weight: bold;">نوع الموقع:</label><br>
                        <select id="input-type" style="width: 100%; padding: 6px; margin-top: 4px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="cabinet">كابينة انترنت</option>
                            <option value="subscriber">مشترك جديد</option>
                        </select><br>
                        
                        <label style="font-size: 13px; font-weight: bold;">الاسم / الرمز:</label><br>
                        <input type="text" id="input-name" required placeholder="مثال: C-102 أو محمد كريم" style="width: 100%; padding: 6px; margin-top: 4px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box;"><br>
                        
                        <button type="submit" style="background: #2563eb; color: white; border: none; padding: 8px 14px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold;">حفظ ونشر مباشر</button>
                    </form>
                </div>
            `;

            L.popup()
                .setLatLng(e.latlng)
                .setContent(formHtml)
                .openOn(map);
        });

        window.addNewPointToCloud = async function(event, lat, lng) {
            event.preventDefault();
            var type = document.getElementById('input-type').value;
            var name = document.getElementById('input-name').value;

            const { error } = await _supabase.from('points').insert([{ type, name, lat, lng }]);
            if (error) {
                alert('خطأ أثناء الحفظ: ' + error.message);
            } else {
                map.closePopup();
            }
        };

        window.updatePointName = async function(id) {
            var newName = document.getElementById(`edit-name-${id}`).value;
            if (!newName) return;

            const { error } = await _supabase.from('points').update({ name: newName }).eq('id', id);
            if (!error) map.closePopup();
        };

        window.deletePoint = async function(id) {
            if (!confirm('هل أنت متأكد من حذف هذا الموقع نهائياً؟')) return;
            const { error } = await _supabase.from('points').delete().eq('id', id);
            if (!error) map.closePopup();
        };

        // 7. نظام تتبع ورسم مسار العامل بالـ GPS وحفظه سحابياً
        let techMarker = null;
        let watchId = null;
        let lastSavedLat = null;
        let lastSavedLng = null;

        const workerIcon = L.divIcon({
            className: 'worker-marker-icon',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        window.startLiveTracking = function() {
            if (!navigator.geolocation) {
                alert("متصفحك لا يدعم خاصية التتبع الجغرافي GPS");
                return;
            }

            document.getElementById('tracking-status').innerText = "جاري الاتصال بالأقمار الصناعية وتحديد المسار...";

            watchId = navigator.geolocation.watchPosition(
                async function(position) {
                    let lat = position.coords.latitude;
                    let lng = position.coords.longitude;

                    document.getElementById('tracking-status').innerText = "🟢 التتبع وحفظ المسار نشط الآن";

                    // رسم/تحديث موقع العامل المباشر
                    if (!techMarker) {
                        techMarker = L.marker([lat, lng], { icon: workerIcon }).addTo(map);
                        techMarker.bindPopup("<b>عامل الصيانة (أنت)</b><br>الموقع الميداني الحالي").openPopup();
                        map.setView([lat, lng], 15);
                    } else {
                        techMarker.setLatLng([lat, lng]);
                    }

                    // حفظ النقطة في السحابة فقط إذا تحرك العامل أكثر من مسافة بسيطة (لتسجيل المسار)
                    if (!lastSavedLat || Math.abs(lat - lastSavedLat) > 0.0001 || Math.abs(lng - lastSavedLng) > 0.0001) {
                        lastSavedLat = lat;
                        lastSavedLng = lng;
                        
                        await _supabase.from('worker_locations').insert([{ lat, lng }]);
                    }
                },
                function(error) {
                    document.getElementById('tracking-status').innerText = "❌ تعذر الحصول على الموقع. تأكد من تفعيل الـ GPS.";
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
            );
        };

        // مسح سجل المسار
        window.clearWorkerRoute = async function() {
            if (!confirm('هل تريد مسح سجل خط المسار بالكامل من السحابة والخريطة؟')) return;
            
            const { error } = await _supabase.from('worker_locations').delete().neq('id', 0);
            if (!error) {
                routeCoordinates = [];
                routePolyline.setLatLngs([]);
                alert('تم مسح سجل المسار بنجاح.');
            }
        };
    </script>
</body>
</html>
